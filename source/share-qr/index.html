<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>微信扫码分享 | Jahee</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border: 1px solid #e6e6e6;
    border-radius: 16px;
    padding: 30px 24px 24px;
    text-align: center;
    box-shadow: 0 6px 28px rgba(0, 0, 0, .07);
  }
  .brand {
    font-size: 12px;
    letter-spacing: .22em;
    color: #7bc549;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 600;
    color: #222;
  }
  .sub {
    margin: 0 0 20px;
    font-size: 13px;
    color: #999;
  }
  /* 二维码必须白底黑点: 这里是专供扫码的页面, 优先保证可扫性, 不跟随站点深色主题 */
  #qr {
    width: 230px;
    height: 230px;
    margin: 0 auto;
    padding: 10px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #qr svg { width: 100%; height: 100%; display: block; }
  #qr svg path { fill: #111; }
  #fallback {
    display: none;
    font-size: 12px;
    color: #999;
    padding: 12px;
    word-break: break-all;
    text-align: left;
  }
  .steps {
    margin: 18px 0 20px;
    font-size: 13px;
    line-height: 1.9;
    color: #777;
    text-align: left;
    padding-left: 18px;
  }
  .actions { display: flex; gap: 10px; }
  .actions button, .actions a {
    flex: 1;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    border-radius: 9px;
    border: 1px solid #ddd;
    background: #fff;
    color: #555;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: border-color .2s, color .2s;
  }
  .actions button:hover, .actions a:hover { border-color: #7bc549; color: #5aa832; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #ddd; }
    .card { background: #1e2028; border-color: #2c2f38; box-shadow: none; }
    h1 { color: #eee; }
    .sub, .steps { color: #9aa0ad; }
    .actions button, .actions a { background: #262932; border-color: #343845; color: #c3c8d2; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Jahee</div>
    <h1 id="title">微信扫码分享</h1>
    <p class="sub">用微信扫一扫，即可分享给好友或发到朋友圈</p>
    <div id="qr"></div>
    <div id="fallback"></div>
    <ol class="steps">
      <li>打开微信，点右上角「+」</li>
      <li>选择「扫一扫」，对着上方二维码</li>
      <li>扫码后点右上角「···」即可转发</li>
    </ol>
    <div class="actions">
      <button type="button" id="copy">复制链接</button>
      <a id="back" href="javascript:history.length>1?history.back():location.assign('/')">返回上一页</a>
    </div>
  </div>
  <script src="/rose-galaxy/vendor/qrcode/qrcode.min.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search)
      const raw = params.get('u') || ''
      // 只接受站内绝对路径或本站 URL: 避免被构造出一个任意外链的二维码页
      const isSameOrigin = (() => {
        if (!raw) return false
        if (raw.charAt(0) === '/' && raw.charAt(1) !== '/') return true
        try { return new URL(raw, location.href).origin === location.origin } catch (e) { return false }
      })()
      const url = isSameOrigin ? raw : '/'
      const title = (params.get('t') || '').slice(0, 80)

      if (title) document.getElementById('title').textContent = title
      document.getElementById('back').href = url

      const box = document.getElementById('qr')
      const fb = document.getElementById('fallback')
      if (typeof qrcode === 'function') {
        try {
          const qr = qrcode(0, 'M')
          qr.addData(new URL(url, location.href).href)
          qr.make()
          box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })
        } catch (e) {
          console.warn('[share-qr] 生成失败:', e)
          box.style.display = 'none'
          fb.style.display = 'block'
          fb.textContent = new URL(url, location.href).href
        }
      } else {
        box.style.display = 'none'
        fb.style.display = 'block'
        fb.textContent = new URL(url, location.href).href
      }

      document.getElementById('copy').addEventListener('click', function () {
        const link = new URL(url, location.href).href
        const done = () => { this.textContent = '已复制 ✓'; setTimeout(() => { this.textContent = '复制链接' }, 1600) }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(done).catch(() => {
            window.prompt('请手动复制链接：', link)
          })
        } else {
          window.prompt('请手动复制链接：', link)
        }
      })
    })()
  </script>
</body>
</html>
