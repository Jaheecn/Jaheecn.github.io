<script>(() => {
  let initFn = window.walineFn || null
  const isMoments = GLOBAL_CONFIG_SITE.pageType === 'moments'
  const option = null

  const destroyWaline = ele => ele.destroy()

  const initWaline = (Fn, el = document, path = window.location.pathname) => {
    const waline = Fn({
      el: el.querySelector('#waline-wrap'),
      serverURL: 'https://yibao11-github-io.vercel.app',
      pageview: true,
      dark: 'html[data-theme="dark"]',
      comment: false,
      ...option,
      path: isMoments ? path : (option && option.path) || path
    })

    if (isMoments) {
      window.momentsComment.destroyWaline = () => {
        destroyWaline(waline)
        if (el.children.length) {
          el.innerHTML = ''
          el.classList.add('no-comment')
        }
      }
    }
  }

  const loadWaline = (el, path) => {
    if (initFn) initWaline(initFn, el, path)
    else {
      btf.getCSS('/rose-galaxy/vendor/waline/waline.min.css?v=__VERSION__')
        .then(() => import('/rose-galaxy/vendor/waline/waline.min.js?v=__VERSION__'))
        .then(({ init }) => {
          initFn = init || Waline.init
          initWaline(initFn, el, path)
          window.walineFn = initFn
        })
    }
  }

  if (isMoments) {
    'Waline' === 'Waline'
      ? window.momentsComment = { loadComment: loadWaline } 
      : window.loadOtherComment = loadWaline
    return
  }

  if ('Waline' === 'Waline' || !false) {
    if (false) btf.loadComment(document.getElementById('waline-wrap'),loadWaline)
    else setTimeout(loadWaline, 0)
  } else {
    window.loadOtherComment = loadWaline
  }
})()</script>
